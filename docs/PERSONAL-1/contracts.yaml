# PERSONAL-1 · contracts · Гэрээ нийтлэх · 2026-09-15
# НИЙТЛЭГДСЭН ХУВИЛБАР: v1.1.0 (`contracts/CHANGELOG.md` үзнэ үү).
# Нийтлэлийн үед нэмэгдсэн (зөвхөн метадата, зан төлөв өөрчлөгдөөгүй):
#   + operationId бүх 10 үйлдэлд (mock · codegen · contract тест эдгээрээр лавлана)
#   + info.license · info.contact · tag бүрийн description (redocly lint цэвэрлэв)
# Дуурайлт (mock): `cd contracts && npm run mock` → http://127.0.0.1:4010
# Гэрээний баримт: `cd contracts && npm run docs` → docs/PERSONAL-1/contract-docs.md
# PERSONAL-1 · contracts · Дэлгэрэнгүй загвар (LLD) · 2026-09-15
# Editor's Ascension — backend API ба домэйн схемийн контракт.
# Тайлбар: spec.md (шалгуур) · plan.md §8 (backend өргөтгөл) · lld.md (энэ контрактын хэрэгжилт).
# Энэ файл нь машин уншигдах эрх бүхий эх сурвалж.
#
# ӨӨРЧЛӨЛТ v1.0.0 → v1.1.0 (энэ шат, `tasks.md → T-42`):
#   + POST /players/{playerId}/actions             (BE-11, BE-12)
#   + GET  /players/{playerId}/save/history        (BE-13)
#   + POST /players/{playerId}/save/restore        (BE-13)
#   + POST /players/{playerId}/transfer-code       (BE-14)
#   + POST /transfer/redeem                        (BE-14)
#   ~ GET  /health → contentVersion + 503 degraded (BE-15)
#   ~ Problem → RFC 9457 (type·title·status·detail·instance·code)  (BE-16)
#   + 429 + Retry-After бүх хамгаалагдсан зам дээр (BE-17)
#   ~ GameState.bossAttempts ба dailyMission нь `required` болов (өмнө нь тодорхойгүй байсан)
#   ~ ProgressionConstants-д restAmount · projectMilestoneXp · dungeonPassRatio нэмэгдэв
openapi: 3.1.0
info:
  title: Editor's Ascension API
  version: 1.1.0
  description: >-
    Ганц тоглогчийн судалгаа-RPG-ийн backend. Хамрах хүрээ: контент пакет тараах,
    нэргүй тоглогчийн save хадгалах, ба (v1.1.0-оос) тоглоомын үйлдлийг эрх бүхий
    талаар `shared/core` домэйнээр хэрэгжүүлэх.
    Домэйн дүрэм нь НЭГ хувилбартай (`shared/core/**`) бөгөөд клиент, сервер хоёул
    ижил кодыг ажиллуулна (plan.md → BE-10). Сервер унтарсан үед клиент локал
    домэйнээр бүрэн ажиллана (AC BE-7).
  license:
    name: UNLICENSED
    identifier: LicenseRef-PROPRIETARY
  contact:
    name: PERSONAL-1 · Editor's Ascension

servers:
  - url: /api

tags:
  - name: players
    description: Нэргүй тоглогчийн бүртгэл ба токен.
  - name: saves
    description: Save унших/бичих, snapshot түүх ба сэргээлт.
  - name: actions
    description: Эрх бүхий домэйн үйлдэл (shared/core-оор хэрэгжинэ).
  - name: transfer
    description: Төхөөрөмж хооронд прогресс шилжүүлэх нэг удаагийн код.
  - name: content
    description: Контент пакет тараалт ба кэш.
  - name: ops
    description: Эрүүл мэнд ба ажиллагааны эндпойнт.

security:
  - playerToken: []

paths:
  # ──────────────────────────────────────────────────────────── ops
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Сервисийн эрүүл мэнд (AC BE-9, BE-15)
      description: >-
        Контент пакет асах үедээ `shared/validate`-ээр шалгагдана. Хүчингүй бол
        сервис degraded — `/content/pack` мөн 503 буцаана (AC BE-15).
      security: []
      responses:
        "200":
          description: Эрүүл
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthOk" }
        "503":
          description: Контент хүчингүй — degraded (AC BE-15)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthDegraded" }

  # ──────────────────────────────────────────────────────── players
  /players:
    post:
      tags: [players]
      operationId: createPlayer
      summary: Нэргүй тоглогч үүсгэх (AC BE-2)
      description: >-
        PII хадгалахгүй. Token нь дахин олгогдохгүй — клиент localStorage-д хадгална.
        Сервер талд token нь зөвхөн hash хэлбэрээр хадгалагдана.
        Rate limit: глобал 30/мин (AC BE-17; IP хадгалахгүй тул IP-д тулгуурлахгүй).
      security: []
      responses:
        "201":
          description: Үүссэн
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerCredentials" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /players/{playerId}/save:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    get:
      tags: [saves]
      operationId: getSave
      summary: Save унших (AC BE-3, BE-4)
      responses:
        "200":
          description: Save олдов
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavePayload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      tags: [saves]
      operationId: putSave
      summary: Save бүтнээр бичих (AC BE-3, BE-4, BE-5)
      description: >-
        Хэрэглээ нь ил хязгаарлагдсан (plan.md P-9): зөвхөн (а) офлайн үйлдлийн дараалал
        алдагдсаны дараах бүтэн эвлэрүүлэг, (б) import хийсэн төлвийг серверт тавих.
        Ердийн тоглолтын бичилт нь `POST /players/{playerId}/actions`.
        Амжилттай бичилт бүр өмнөх төлвийг snapshot болгоно (AC BE-13).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavePayload" }
      responses:
        "200":
          description: Хадгалагдав
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /players/{playerId}/save/history:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    get:
      tags: [saves]
      operationId: getSaveHistory
      summary: Snapshot түүх (AC BE-13)
      description: Хамгийн сүүлийн 10 snapshot, шинэ нь эхэнд. Агуулга буцаахгүй — зөвхөн лавлагаа.
      responses:
        "200":
          description: Түүх
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /players/{playerId}/save/restore:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    post:
      tags: [saves]
      operationId: restoreSave
      summary: Snapshot-оос сэргээх (AC BE-13)
      description: >-
        Сэргээлт өөрөө шинэ snapshot үүсгэнэ (`reason: restore`) — сэргээсэн үйлдэл
        эргүүлэн буцаагдах боломжтой байх ёстой.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "200":
          description: Сэргээгдэв
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavePayload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ──────────────────────────────────────────────────────── actions
  /players/{playerId}/actions:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    post:
      tags: [actions]
      operationId: applyActions
      summary: Эрх бүхий домэйн үйлдэл (AC BE-11, BE-12)
      description: >-
        Үйлдлийн массивыг `shared/core`-оор ДАРААЛАН хэрэгжүүлнэ. **Атом**: нэг үйлдэл
        домэйнээр татгалзвал бүх багц буцаагдаж 422 гарна, хадгалагдсан төлөв ӨӨРЧЛӨГДӨХГҮЙ.
        Idempotency: `actionId` тус бүрээр бүртгэгдэнэ; өмнө хэрэгжсэн `actionId` дахин
        ирвэл домэйн ДАХИН ажиллахгүй (`status: replayed`), анхны event-үүд буцна.
        `If-Match` нь сонголттой — өгвөл хуучирсан ETag → 409 (клиент эхлээд GET хийнэ).
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionBatchRequest" }
      responses:
        "200":
          description: Багц хэрэгжив (эсвэл бүхэлдээ replayed)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionBatchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/DomainRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Degraded" }

  # ─────────────────────────────────────────────────────── transfer
  /players/{playerId}/transfer-code:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    post:
      tags: [transfer]
      operationId: createTransferCode
      summary: Төхөөрөмж хооронд шилжүүлэх код үүсгэх (AC BE-14)
      description: >-
        TTL 15 минут, криптографийн санамсаргүй. Код нь сервер талд зөвхөн hash хэлбэрээр
        хадгалагдана. Хариунд save-ийн агуулга ОРОХГҮЙ. Шинэ код үүсгэвэл өмнөх идэвхтэй
        код хүчингүй болно (нэг тоглогчид нэг идэвхтэй код).
      responses:
        "201":
          description: Код үүсэв
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferCode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /transfer/redeem:
    post:
      tags: [transfer]
      operationId: redeemTransferCode
      summary: Шилжүүлэх код ашиглах (AC BE-14)
      description: >-
        Код **нэг удаа**. Амжилттай бол ШИНЭ `{playerId, token}` олгож, эх тоглогчийн
        save-ийн хуулбарыг шинэ тоглогчид үүсгэнэ. Эх тоглогчийн save хэвээр үлдэнэ.
        Ашигласан · хугацаа дууссан · олдоогүй — бүгд **410** (кодын оршин тогтнолыг
        задруулахгүйн тулд ялгаагүй хариу).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemRequest" }
      responses:
        "201":
          description: Шинэ тоглогч үүсэж save хуулагдав
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerCredentials" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ──────────────────────────────────────────────────────── content
  /content/pack:
    get:
      tags: [content]
      operationId: getContentPack
      summary: Контент пакет (AC BE-6, BE-15)
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Пакет
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control:
              description: "`public, max-age=300, must-revalidate`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentPack" }
        "304": { description: Өөрчлөгдөөгүй }
        "503": { $ref: "#/components/responses/Degraded" }

components:
  securitySchemes:
    playerToken:
      type: http
      scheme: bearer
      description: /players-ээс олгогдсон token. playerId-тай таарахгүй бол 403 (AC BE-4).

  parameters:
    PlayerId:
      name: playerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Сүүлд уншсан ETag. Анхны бичилтэд `*`.
      schema: { type: string }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Өгвөл хуучирсан ETag → 409.
      schema: { type: string }

  headers:
    ETag:
      description: Save-ийн одоогийн хувилбар. Дараагийн бичилтэд `If-Match`-аар ашиглана.
      schema: { type: string, example: "W/\"7\"" }
    RetryAfter:
      description: Дахин оролдох хүртэлх секунд (AC BE-17).
      schema: { type: integer, minimum: 1, example: 30 }

  responses:
    BadRequest:
      description: Схемийн алдаа (AC BE-5)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Token байхгүй/буруу (AC BE-4)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Token өөр тоглогчийнх (AC BE-4)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Олдсонгүй
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: ETag хуучирсан — өөр бичилт түрүүлсэн (AC BE-3)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Gone:
      description: Код ашиглагдсан · хугацаа дууссан · олдсонгүй (AC BE-14)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Бие 1MB-аас том (AC BE-5)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    DomainRejected:
      description: >-
        Домэйн үйлдлийг татгалзав (AC BE-11). `code` нь `RejectionReason`,
        `actionId` нь татгалзсан үйлдлийг заана. Багц бүхэлдээ буцаагдсан.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Хурдны хязгаар (AC BE-17)
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Degraded:
      description: Контент хүчингүй — сервис degraded (AC BE-15)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ──────────────────────────────────────────── алдаа (RFC 9457)
    Problem:
      description: RFC 9457 problem details. Бүх 4xx/5xx хариу ЭНЭ хэлбэртэй (AC BE-16).
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code:
          description: Машин уншигдах код. Домэйн татгалзалд `RejectionReason`-ы утга.
          type: string
        actionId:
          description: 422 үед — татгалзсан үйлдлийн id (AC BE-11)
          type: string
          format: uuid
        errors:
          description: 400 үед — талбарын түвшний алдаа (AC BE-5)
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: "JSON Pointer, ж: `/state/xp`" }
              message: { type: string }

    RejectionReason:
      description: Домэйн үйлдэл татгалзах шалтгаан (spec.md → D-4)
      type: string
      enum:
        - INSUFFICIENT_STAMINA
        - PREREQ_NOT_MET
        - LEVEL_TOO_LOW
        - ALREADY_COMPLETED
        - NOT_REPEATABLE
        - INSUFFICIENT_SKILL_POINTS
        - INVALID_INPUT

    # ──────────────────────────────────────────────────────── ops
    HealthOk:
      type: object
      required: [status, version, contentVersion]
      properties:
        status: { type: string, const: ok }
        version: { type: string, description: Серверийн хувилбар }
        contentVersion:
          type: string
          description: Контент пакетын тогтвортой hash — `/content/pack`-ийн ETag-тай ижил утга.
      example: { status: ok, version: "1.1.0", contentVersion: "c3f1a9" }

    HealthDegraded:
      type: object
      required: [status, version, reason]
      properties:
        status: { type: string, const: degraded }
        version: { type: string }
        reason:
          type: string
          description: Хүний уншихад зориулсан шалтгаан. Контентын түүхий агуулга ОРОХГҮЙ.

    # ─────────────────────────────────────────────────── players
    PlayerCredentials:
      type: object
      additionalProperties: false
      required: [playerId, token]
      properties:
        playerId: { type: string, format: uuid }
        token:
          description: 32 байт санамсаргүй, base64url. Сервер талд зөвхөн hash хадгална.
          type: string
          minLength: 43

      example:
        playerId: 6f2a1c94-3d8e-4b7a-9f10-2c5de7b8a041
        token: 9Qe1xM7bK2pR4tY6uI8oA0sD3fG5hJ7kL9zX1cV3bN5m

    # ───────────────────────────────────────────────────── saves
    SavePayload:
      type: object
      additionalProperties: false
      required: [schemaVersion, state, updatedAt]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/GameState" }

    SaveAck:
      type: object
      additionalProperties: false
      required: [updatedAt, etag]
      properties:
        updatedAt: { type: string, format: date-time }
        etag: { type: string }

    RestoreRequest:
      type: object
      additionalProperties: false
      required: [snapshotId]
      properties:
        snapshotId: { type: string, format: uuid }

    SnapshotRef:
      description: Snapshot-ийн лавлагаа. Төлвийн агуулга ОРОХГҮЙ (AC BE-13).
      type: object
      additionalProperties: false
      required: [snapshotId, createdAt, schemaVersion, reason]
      properties:
        snapshotId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        schemaVersion: { type: integer, minimum: 1 }
        reason:
          type: string
          enum: [put, actions, restore]
          description: Snapshot үүсгэсэн шалтгаан.

    SaveHistory:
      type: object
      additionalProperties: false
      required: [snapshots]
      properties:
        snapshots:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/SnapshotRef" }

    # ─────────────────────────────────────────────────── actions
    ActionType:
      description: >-
        Домэйн үйлдлийн төрөл. `shared/core`-ийн нэг функцтэй нэг-нэгээр харгалзана
        (lld.md §5.4). Энэ жагсаалт нь `GameState`-ийн БҮХ бичигдэх талбарыг хамарна —
        хамаарахгүй талбар үлдвэл тэр талбар серверээр эрх бүхий болж чадахгүй.
      type: string
      enum:
        - claimQuest
        - rest
        - unlockSkill
        - dungeonAttempt
        - projectCreate
        - projectMilestone
        - projectUpdate
        - bossAttempt
        - rollDailyMission
        - resolveEncounter
        - updateSettings

    Action:
      type: object
      additionalProperties: false
      required: [actionId, type, at, payload]
      properties:
        actionId:
          description: Клиент үүсгэсэн UUIDv4. Idempotency түлхүүр (AC BE-12).
          type: string
          format: uuid
        type: { $ref: "#/components/schemas/ActionType" }
        at:
          description: >-
            Клиент дээрх үйлдлийн цаг. Домэйнд `clock`-ийн оронд дамжина (plan.md P-5).
            Сервер нь ирээдүйд 5 минутаас илүү хазайсан цагийг татгалзана (INVALID_INPUT).
          type: string
          format: date-time
        seed:
          description: RNG seed (loot, encounter). Байхгүй бол сервер үүсгэнэ (AC EC-2, ENC-2).
          type: integer
          minimum: 0
        payload:
          description: >-
            Төрлөөс хамаарсан бие. Сервер нь `type`-аар нь салгаж `shared/validate`-ийн
            харгалзах validator-оор шалгана (lld.md §6.5 хүснэгт).
          type: object

    ActionBatchRequest:
      type: object
      additionalProperties: false
      required: [actions]
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/Action" }

    DomainEvent:
      description: Домэйн функцийн гаргасан event (spec.md D-2). UI нь эдгээрээр feedback үзүүлнэ.
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - XP_GAINED
            - LEVEL_UP
            - SKILL_POINT_GAINED
            - SKILL_UNLOCKED
            - STAMINA_SPENT
            - STAMINA_RESTORED
            - QUEST_COMPLETED
            - SIDE_QUEST_COMPLETED
            - DUNGEON_PASSED
            - DUNGEON_FAILED
            - COINS_GAINED
            - LOOT_DROPPED
            - ACHIEVEMENT_UNLOCKED
            - STREAK_EXTENDED
            - STREAK_RESET
            - COMBO_CHANGED
            - PROJECT_CREATED
            - PROJECT_MILESTONE_COMPLETED
            - PROJECT_COMPLETED
            - BOSS_ATTEMPT_LOGGED
            - BOSS_PASSED
            - ENCOUNTER_TRIGGERED
            - DAILY_MISSION_ROLLED
            - SETTINGS_UPDATED
        data:
          type: object
          description: "Event-ээс хамаарсан нэмэлт (ж. `{ amount: 40 }`, `{ level: 3 }`)."

    ActionResult:
      type: object
      additionalProperties: false
      required: [actionId, status, events]
      properties:
        actionId: { type: string, format: uuid }
        status:
          type: string
          enum: [applied, replayed]
          description: >-
            `replayed` = энэ `actionId` өмнө нь хэрэгжсэн; домэйн ДАХИН ажиллаагүй,
            анхны event-үүд буцсан (AC BE-12).
        events:
          type: array
          items: { $ref: "#/components/schemas/DomainEvent" }

    ActionBatchResponse:
      type: object
      additionalProperties: false
      required: [state, results, updatedAt, etag]
      properties:
        state:
          description: Хэрэгжүүлсний ДАРААХ эрх бүхий төлөв. Клиент үүгээр локал төлвийг СОЛИНО.
          $ref: "#/components/schemas/GameState"
        results:
          type: array
          items: { $ref: "#/components/schemas/ActionResult" }
        updatedAt: { type: string, format: date-time }
        etag: { type: string }

    # ────────────────────────────────────────────────── transfer
    TransferCodeString:
      description: >-
        Crockford base32, 4-4-4 бүлэг (ж. `K7QM-2X4T-9BRH`). Том/жижиг үсэг ба зураас
        үл хамаарна; `I·L·O·U` тэмдэгт байхгүй (уншилтын алдаанаас сэргийлнэ).
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}-?[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}-?[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}$"

    TransferCode:
      type: object
      additionalProperties: false
      required: [code, expiresAt]
      properties:
        code: { $ref: "#/components/schemas/TransferCodeString" }
        expiresAt: { type: string, format: date-time }

    RedeemRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/TransferCodeString" }

    # ────────────────────────────────────────────── домэйн төлөв
    GameState:
      description: TECH_SPEC §Domain state-ийн бүрэн хэлбэр. Export/import файлын агуулга ч мөн энэ.
      type: object
      additionalProperties: false
      required:
        [schemaVersion, xp, level, stamina, maxStamina, coins, skillPoints, combo, streak,
         completedMainQuestIds, sideQuestStats, completedDungeonIds, unlockedSkillIds,
         inventory, achievementIds, bossAttempts, dailyMission, projects, settings]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        xp: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1, maximum: 10 }
        stamina: { type: integer, minimum: 0 }
        maxStamina: { type: integer, const: 10 }
        coins: { type: integer, minimum: 0 }
        skillPoints: { type: integer, minimum: 0 }
        combo:
          description: >-
            Дараалсан идэвхтэй өдрийн claim-ийн тоолуур (lld.md §5.4.11). Cosmetic —
            XP · stamina · unlock-д НӨЛӨӨЛӨХГҮЙ (AC EC-1-ийн зарчим).
          type: integer
          minimum: 0
        streak:
          type: object
          additionalProperties: false
          required: [current, best, lastQualifiedDate]
          properties:
            current: { type: integer, minimum: 0 }
            best: { type: integer, minimum: 0 }
            lastQualifiedDate: { type: [string, "null"], format: date }
        completedMainQuestIds:
          type: array
          items: { type: string }
          uniqueItems: true
        sideQuestStats:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [completions, lastCompletedAt]
            properties:
              completions: { type: integer, minimum: 1 }
              lastCompletedAt: { type: [string, "null"], format: date-time }
        completedDungeonIds: { type: array, items: { type: string }, uniqueItems: true }
        unlockedSkillIds: { type: array, items: { type: string }, uniqueItems: true }
        inventory: { type: array, items: { type: string }, uniqueItems: true }
        achievementIds: { type: array, items: { type: string }, uniqueItems: true }
        bossAttempts:
          description: AC BS-4 — оролдлогын түүх (тэнцсэн эсэхээс үл хамааран бүгд)
          type: array
          items:
            type: object
            additionalProperties: false
            required: [bossId, at, scores, total, tier]
            properties:
              bossId: { type: string }
              at: { type: string, format: date-time }
              scores: { $ref: "#/components/schemas/BossScores" }
              total: { type: integer, minimum: 0, maximum: 60 }
              tier: { type: string, enum: [failed, mvp, advanced, mastery] }
        dailyMission:
          type: [object, "null"]
          additionalProperties: false
          required: [questId, date]
          properties:
            questId: { type: string }
            date: { type: string, format: date }
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectState" }
        settings:
          type: object
          additionalProperties: false
          required: [reducedMotion, soundEnabled]
          properties:
            reducedMotion: { type: boolean }
            soundEnabled: { type: boolean }

      example:
        schemaVersion: 1
        xp: 140
        level: 2
        stamina: 7
        maxStamina: 10
        coins: 60
        skillPoints: 1
        combo: 2
        streak: { current: 3, best: 5, lastQualifiedDate: "2026-09-14" }
        completedMainQuestIds: [mq-first-cut, mq-blender-toybox]
        sideQuestStats:
          sq-hotkey-hunter: { completions: 2, lastCompletedAt: "2026-09-14T19:12:00Z" }
        completedDungeonIds: [dg-timeline-basics]
        unlockedSkillIds: [sk-precision-cut]
        inventory: [loot-golden-razor]
        achievementIds: [ach-first-blood]
        bossAttempts: []
        dailyMission: { questId: sq-three-cut-story, date: "2026-09-15" }
        projects: []
        settings: { reducedMotion: false, soundEnabled: true }

    BossScores:
      description: AC BS-1 — 6 ангилал, тус бүр 0..10
      type: object
      additionalProperties: false
      required: [story, editing, camera, visualCraft, animation, audioPost]
      properties:
        story: { type: integer, minimum: 0, maximum: 10 }
        editing: { type: integer, minimum: 0, maximum: 10 }
        camera: { type: integer, minimum: 0, maximum: 10 }
        visualCraft: { type: integer, minimum: 0, maximum: 10 }
        animation: { type: integer, minimum: 0, maximum: 10 }
        audioPost: { type: integer, minimum: 0, maximum: 10 }

    ProjectState:
      type: object
      additionalProperties: false
      required: [id, title, milestones, notes, nextAction, createdAt]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 120 }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        notes: { type: string, maxLength: 4000 }
        nextAction: { type: string, maxLength: 500 }
        evidenceRef: { type: [string, "null"], maxLength: 500 }
        selfScore: { type: [integer, "null"], minimum: 0, maximum: 10 }
        milestones:
          description: AC PJ-1 — PRD §13-ийн 10 milestone, яг энэ дарааллаар
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [key, done]
            properties:
              key:
                type: string
                enum: [concept, brief, storyboard, assets, animation, render,
                       editAudioColor, review, finalExport, portfolio]
              done: { type: boolean }
              completedAt: { type: [string, "null"], format: date-time }

    # ─────────────────────────────────────────────────── контент
    QuestDefinition:
      description: TECH_SPEC §Quest schema + PRD §9-ийн бүх заавал талбар (AC MQ-5)
      type: object
      additionalProperties: false
      required:
        [id, track, world, levelRequired, type, title, summary, description,
         estimatedMinutes, staminaCost, xp, tags, prerequisites, tutorialRefs,
         deliverables, victoryConditions, stretchGoals, reflectionPrompt, repeatable]
      properties:
        id: { type: string, pattern: "^[a-z0-9-]+$" }
        track: { type: string, enum: [main, side, dungeon, boss, raid] }
        world: { type: integer, minimum: 1, maximum: 5 }
        levelRequired: { type: integer, minimum: 1, maximum: 10 }
        type: { type: string, enum: [training, mission, boss, raid, final] }
        title: { type: string, minLength: 1 }
        summary: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        estimatedMinutes: { type: integer, minimum: 1 }
        staminaCost: { type: integer, minimum: 1, maximum: 6 }
        xp: { type: integer, minimum: 1 }
        tags:
          type: array
          minItems: 1
          items:
            type: string
            enum: [video-editing, blender, animation, cinematography, audio, vfx, storytelling]
        prerequisites: { type: array, items: { type: string } }
        tutorialRefs: { type: array, items: { $ref: "#/components/schemas/TutorialRef" } }
        deliverables: { type: array, minItems: 1, items: { type: string } }
        victoryConditions: { type: array, minItems: 1, items: { type: string } }
        stretchGoals: { type: array, minItems: 1, items: { type: string } }
        reflectionPrompt: { type: string, minLength: 1 }
        repeatable: { type: boolean }
        repeatXpMultiplier:
          description: AC SQ-2 — давтан XP коэффициент (default 0.5)
          type: number
          exclusiveMinimum: 0
          maximum: 1

    TutorialRef:
      type: object
      additionalProperties: false
      required: [title, url, minutes]
      properties:
        title: { type: string, minLength: 1 }
        url: { type: string, format: uri }
        minutes: { type: integer, minimum: 1 }

    DungeonDefinition:
      type: object
      additionalProperties: false
      required: [id, title, conceptGoal, estimatedMinutes, xp, tags, tutorialRefs, questions]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1 }
        conceptGoal: { type: string, minLength: 1 }
        estimatedMinutes: { type: integer, minimum: 1 }
        xp: { type: integer, minimum: 1 }
        tags: { type: array, minItems: 1, items: { type: string } }
        tutorialRefs:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/TutorialRef" }
        questions:
          description: AC DG-1, DG-3 — тэнцэх босго нь зөв хариултын ≥70%
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, prompt, options, correctIndex, explanation]
            properties:
              id: { type: string }
              prompt: { type: string, minLength: 1 }
              options: { type: array, minItems: 2, items: { type: string } }
              correctIndex: { type: integer, minimum: 0 }
              explanation: { type: string, minLength: 1 }

    AchievementDefinition:
      type: object
      additionalProperties: false
      required: [id, title, description, predicate]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        predicate:
          description: Машинаар шалгагдах нөхцөл (AC ACH-1)
          type: object
          additionalProperties: false
          required: [kind, value]
          properties:
            kind:
              type: string
              enum: [level, totalXp, mainQuestsCompleted, sideQuestCompletions,
                     dungeonsCompleted, projectsCompleted, bossTier, streakDays]
            value: { type: [integer, string] }

    EncounterDefinition:
      type: object
      additionalProperties: false
      required: [id, title, body, callToAction, weight]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        callToAction: { type: string, minLength: 1 }
        maxMinutes: { type: integer, minimum: 1, maximum: 2 }
        weight: { type: number, exclusiveMinimum: 0 }

    LootItem:
      type: object
      additionalProperties: false
      required: [id, title, rarity, effect]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1 }
        rarity: { type: string, enum: [common, rare, epic, legendary] }
        effect:
          description: AC EC-1 — MVP-д зөвхөн cosmetic
          type: string
          const: cosmetic

    SkillDefinition:
      type: object
      additionalProperties: false
      required: [id, title, description, cost, prerequisites]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        cost: { type: integer, const: 1 }
        prerequisites: { type: array, items: { type: string } }

    ContentPack:
      type: object
      additionalProperties: false
      required: [version, quests, dungeons, skills, achievements, encounters, loot]
      properties:
        version: { type: string }
        quests:
          description: AC MQ-1 (18 main), AC SQ-1 (≥20 side)
          type: array
          items: { $ref: "#/components/schemas/QuestDefinition" }
        dungeons: { type: array, items: { $ref: "#/components/schemas/DungeonDefinition" } }
        skills: { type: array, items: { $ref: "#/components/schemas/SkillDefinition" } }
        achievements:
          type: array
          minItems: 12
          items: { $ref: "#/components/schemas/AchievementDefinition" }
        encounters:
          type: array
          minItems: 5
          items: { $ref: "#/components/schemas/EncounterDefinition" }
        loot: { type: array, items: { $ref: "#/components/schemas/LootItem" } }

    ProgressionConstants:
      description: >-
        AC PRG-1, PRG-2, BS-2 — тогтмолууд контрактын хэсэг. `shared/core/constants.ts`
        нь эдгээрийн ЦОРЫН ГАНЦ хувилбар; `web-app/src/**` ба `server/src/**` дотор
        дахин бичигдвэл `T-43`-ийн сканнердсан тест УНАНА (AC BE-10).
      type: object
      additionalProperties: false
      required: [xpThresholds, rankNames, bossTiers, maxStamina, restAmount,
                 projectMilestoneXp, defaultRepeatXpMultiplier, dungeonPassRatio,
                 sideQuestXpFloorRatio, encounterChance, lootChance]
      properties:
        xpThresholds:
          type: array
          minItems: 9
          maxItems: 9
          items: { type: integer }
          const: [100, 250, 500, 1000, 1750, 2750, 4000, 5500, 7500]
        rankNames:
          type: array
          minItems: 10
          maxItems: 10
          const: [Recruit, Apprentice, Cadet, Editor, Animator, Specialist,
                  Director, "Cinematic Artist", "Senior Generalist", "Cinematic Master"]
        bossTiers:
          type: object
          additionalProperties: false
          required: [mvp, advanced, mastery]
          properties:
            mvp: { type: integer, const: 35 }
            advanced: { type: integer, const: 45 }
            mastery: { type: integer, const: 52 }
        maxStamina:
          description: AC STA-1
          type: integer
          const: 10
        restAmount:
          description: AC STA-3
          type: integer
          const: 3
        projectMilestoneXp:
          description: AC PJ-3
          type: integer
          const: 25
        defaultRepeatXpMultiplier:
          description: AC SQ-2
          type: number
          const: 0.5
        dungeonPassRatio:
          description: AC DG-3
          type: number
          const: 0.7
        sideQuestXpFloorRatio:
          description: AC SQ-2 — давтан XP-ийн доод шал `ceil(baseXp * 0.1)`
          type: number
          const: 0.1
        encounterChance:
          description: >-
            AC ENC-2 — claim тутамд тохиолдол гарах магадлал. ⚠ Эх шаардлагад БАЙХГҮЙ,
            загварын шатны сонголт (lld.md → A-LLD-2). Тохируулга нь зөвхөн энэ утга.
          type: number
          const: 0.25
        lootChance:
          description: >-
            AC EC-2 — claim тутамд loot унах магадлал. ⚠ Эх шаардлагад БАЙХГҮЙ,
            загварын шатны сонголт (lld.md → A-LLD-2).
          type: number
          const: 0.35
